<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Bible Portal</title>
    <!-- YouVersion Vanilla JS Web SDK -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #2f2e2e;
            --text-color: #ffffff;
            --accent-color: #990000; /* Crimson Red */
            --input-bg: #403f3f;
            --border-color: #555555;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 15px;
            background-color: var(--bg-color); 
            color: var(--text-color); 
        }

        h3 { margin-top: 0; margin-bottom: 10px; color: var(--text-color); font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px;}
        .testament-title { font-size: 14px; font-weight: bold; color: #ccc; margin: 12px 0 6px 0; text-transform: uppercase; border-left: 3px solid var(--accent-color); padding-left: 6px; }

        .section {
            background-color: #383737;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 35px; /* Spaced out for mobile breathing room */
            border: 1px solid var(--border-color);
        }

        .controls { display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; gap: 8px; }
        
        select, input { 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            font-size: 16px; 
            width: 100%; 
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }
        select:focus, input:focus {
            outline: 2px solid var(--accent-color);
        }

        button { 
            padding: 12px 20px; 
            background-color: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            white-space: nowrap;
            transition: background 0.2s;
        }
        button:hover { background-color: #b30000; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 5px;
        }
        .grid::-webkit-scrollbar { width: 6px; }
        .grid::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 4px; }

        .grid-item {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .grid-item:hover, .grid-item.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .bible-output { 
            line-height: 1.7; 
            font-size: 18px; 
            margin-top: 15px; 
            padding: 15px;
            background-color: #383737;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .bible-output p { margin-bottom: 12px; }
        .bible-output .v { color: var(--accent-color); font-weight: bold; margin-right: 4px; font-size: 14px; }
        
        .search-results-list { list-style: none; padding: 0; margin: 10px 0 0 0; }
        .search-results-list li { 
            padding: 10px; 
            border-bottom: 1px solid var(--border-color); 
            cursor: pointer; 
        }
        .search-results-list li:hover { background-color: var(--input-bg); }
        .result-ref { font-weight: bold; color: var(--accent-color); display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- Translation Configuration Section -->
    <div class="section">
        <h3>1. Translation</h3>
        <select id="versionSelect" onchange="onVersionChange()">
            <option value="111">English (NIV)</option>
            <option value="12">English (KJV)</option>
            <option value="149">Spanish (RVR1960)</option>
            <option value="138">Polish (UBG)</option>
            <option value="122">Italian (NR2006)</option>
            <option value="63">French (LSG)</option>
            <option value="154">Portuguese (NVI)</option>
        </select>
    </div>

    <!-- Browse Section -->
    <div class="section">
        <h3>2. Browse Books & Chapters</h3>
        <div id="browseContainer">
            <div class="testament-title">Old Testament</div>
            <div id="otGrid" class="grid"></div>
            
            <div class="testament-title">New Testament</div>
            <div id="ntGrid" class="grid"></div>
        </div>
        <div id="chapterGrid" class="grid" style="display:none;"><!-- Dynamically filled chapters --></div>
        <button id="backToBooksBtn" onclick="renderBooks()" style="display:none; margin-top:10px; width:100%;">← Back to Books</button>
    </div>

    <!-- Keyword & Reference Search Section -->
    <div class="section">
        <h3>3. Search</h3>
        <div class="controls">
            <div class="row">
                <input type="text" id="keywordInput" placeholder="Enter keywords (e.g., 'faith', 'love')">
                <button onclick="searchKeywords()">Search Terms</button>
            </div>
            <div class="row">
                <input type="text" id="verseInput" placeholder="Or enter exact reference (e.g., John 3:16)">
                <button onclick="lookupReference()">Go to Verse</button>
            </div>
        </div>
        <div id="searchResults" style="display:none;">
            <ul id="resultsList" class="search-results-list"></ul>
        </div>
    </div>

    <!-- Reader Section -->
    <h3>Scripture Reader</h3>
    <div id="output" class="bible-output">Select a translation and choose a book or run a search to begin reading.</div>

    <script>
        // Initialize YouVersion SDK
        const yv = new YouVersionPlatform({
            appKey: "YOUR_YOUVERSION_APP_KEY" // <-- Paste your App Key from ://youversion.com
        });

        // Fully populated 66-book array with official YouVersion USFM identification tags
        const bibleBooks = [
            // Old Testament
            { name: "Genesis", id: "GEN", chapters: 50, testament: "OT" },
            { name: "Exodus", id: "EXO", chapters: 40, testament: "OT" },
            { name: "Leviticus", id: "LEV", chapters: 27, testament: "OT" },
            { name: "Numbers", id: "NUM", chapters: 36, testament: "OT" },
            { name: "Deuteronomy", id: "DEU", chapters: 34, testament: "OT" },
            { name: "Joshua", id: "JOS", chapters: 24, testament: "OT" },
            { name: "Judges", id: "JDG", chapters: 21, testament: "OT" },
            { name: "Ruth", id: "RUT", chapters: 4, testament: "OT" },
            { name: "1 Samuel", id: "1SA", chapters: 31, testament: "OT" },
            { name: "2 Samuel", id: "2SA", chapters: 24, testament: "OT" },
            { name: "1 Kings", id: "1KI", chapters: 22, testament: "OT" },
            { name: "2 Kings", id: "2KI", chapters: 25, testament: "OT" },
            { name: "1 Chronicles", id: "1CH", chapters: 29, testament: "OT" },
            { name: "2 Chronicles", id: "2CH", chapters: 36, testament: "OT" },
            { name: "Ezra", id: "EZR", chapters: 10, testament: "OT" },
            { name: "Nehemiah", id: "NEH", chapters: 13, testament: "OT" },
            { name: "Esther", id: "EST", chapters: 10, testament: "OT" },
            { name: "Job", id: "JOB", chapters: 42, testament: "OT" },
            { name: "Psalms", id: "PSA", chapters: 150, testament: "OT" },
            { name: "Proverbs", id: "PRO", chapters: 31, testament: "OT" },
            { name: "Ecclesiastes", id: "ECC", chapters: 12, testament: "OT" },
            { name: "Song of Solomon", id: "SNG", chapters: 8, testament: "OT" },
            { name: "Isaiah", id: "ISA", chapters: 66, testament: "OT" },
            { name: "Jeremiah", id: "JER", chapters: 52, testament: "OT" },
            { name: "Lamentations", id: "LAM", chapters: 5, testament: "OT" },
            { name: "Ezekiel", id: "EZK", chapters: 48, testament: "OT" },
            { name: "Daniel", id: "DAN", chapters: 12, testament: "OT" },
            { name: "Hosea", id: "HOS", chapters: 14, testament: "OT" },
            { name: "Joel", id: "JOL", chapters: 3, testament: "OT" },
            { name: "Amos", id: "AMO", chapters: 9, testament: "OT" },
            { name: "Obadiah", id: "OBA", chapters: 1, testament: "OT" },
            { name: "Jonah", id: "JON", chapters: 4, testament: "OT" },
            { name: "Micah", id: "MIC", chapters: 7, testament: "OT" },
            { name: "Nahum", id: "NAM", chapters: 3, testament: "OT" },
            { name: "Habakkuk", id: "HAB", chapters: 3, testament: "OT" },
            { name: "Zephaniah", id: "ZEP", chapters: 3, testament: "OT" },
            { name: "Haggai", id: "HAG", chapters: 2, testament: "OT" },
            { name: "Zechariah", id: "ZEC", chapters: 14, testament: "OT" },
            { name: "Malachi", id: "MAL", chapters: 4, testament: "OT" },
            // New Testament
            { name: "Matthew", id: "MAT", chapters: 28, testament: "NT" },
            { name: "Mark", id: "MRK", chapters: 16, testament: "NT" },
            { name: "Luke", id: "LUK", chapters: 24, testament: "NT" },
            { name: "John", id: "JHN", chapters: 21, testament: "NT" },
            { name: "Acts", id: "ACT", chapters: 28, testament: "NT" },
            { name: "Romans", id: "ROM", chapters: 16, testament: "NT" },
            { name: "1 Corinthians", id: "1CO", chapters: 16, testament: "NT" },
            { name: "2 Corinthians", id: "2CO", chapters: 13, testament: "NT" },
            { name: "Galatians", id: "GAL", chapters: 6, testament: "NT" },
            { name: "Ephesians", id: "EPH", chapters: 6, testament: "NT" },
            { name: "Philippians", id: "PHP", chapters: 4, testament: "NT" },
            { name: "Colossians", id: "COL", chapters: 4, testament: "NT" },
            { name: "1 Thessalonians", id: "1TH", chapters: 5, testament: "NT" },
            { name: "2 Thessalonians", id: "2TH", chapters: 3, testament: "NT" },
            { name: "1 Timothy", id: "1TI", chapters: 6, testament: "NT" },
            { name: "2 Timothy", id: "2TI", chapters: 4, testament: "NT" },
            { name: "Titus", id: "TIT", chapters: 3, testament: "NT" },
            { name: "Philemon", id: "PHM", chapters: 1, testament: "NT" },
            { name: "Hebrews", id: "HEB", chapters: 13, testament: "NT" },
            { name: "James", id: "JAS", chapters: 5, testament: "NT" },
            { name: "1 Peter", id: "1PE", chapters: 5, testament: "NT" },
            { name: "2 Peter", id: "2PE", chapters: 3, testament: "NT" },
            { name: "1 John", id: "1JN", chapters: 5, testament: "NT" },
            { name: "2 John", id: "2JN", chapters: 1, testament: "NT" },
            { name: "3 John", id: "3JN", chapters: 1, testament: "NT" },
            { name: "Jude", id: "JUD", chapters: 1, testament: "NT" },
            { name: "Revelation", id: "REV", chapters: 22, testament: "NT" }
            ];
        function renderBooks() {
            const otGrid = document.getElementById('otGrid');
            const ntGrid = document.getElementById('ntGrid');
            const browseContainer = document.getElementById('browseContainer');
            const chapterGrid = document.getElementById('chapterGrid');
            const backBtn = document.getElementById('backToBooksBtn');
            otGrid.innerHTML = "";
            ntGrid.innerHTML = "";
            browseContainer.style.display = 'block';
            chapterGrid.style.display = 'none';
            backBtn.style.display = 'none';
            bibleBooks.forEach(book => {
                const item = document.createElement('div');
                item.className = 'grid-item';
                item.innerText = book.name;
                item.onclick = () => selectBook(book);
                if (book.testament === "OT") {
                    otGrid.appendChild(item);
                } else {
                    ntGrid.appendChild(item);
                }
            });
        }
        function selectBook(book) {
            document.getElementById('browseContainer').style.display = 'none';
            const chapterGrid = document.getElementById('chapterGrid');
            const backBtn = document.getElementById('backToBooksBtn');
            chapterGrid.innerHTML = "";
            chapterGrid.style.display = 'grid';
            backBtn.style.display = 'block';
            for (let i = 1; i <= book.chapters; i++) {
                const item = document.createElement('div');
                item.className = 'grid-item';
                item.innerText = i;
                item.onclick = () => loadChapter(book.id, i);
                chapterGrid.appendChild(item);
            }
        }
        function onVersionChange() {
            renderBooks();}
        async function loadChapter(bookId, chapterNum) {
            const versionId = 
                parseInt(document.getElementById('versionSelect').value);
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Loading Chapter...";
            try {
                const response = await yv.bible.getText({
                    version_id: versionId,
                    reference: ${bookId}.${chapterNum}
                });
                outputDiv.innerHTML = <h2>${bookId} ${chapterNum}</h2> + 
                    response.data.content;
            } catch (error) {
                outputDiv.innerHTML = "Error loading chapter. Please verify your API setup.";
            }
        }
        async function lookupReference() {
            const versionId = 
                parseInt(document.getElementById('versionSelect').value);
            const query = document.getElementById('verseInput').value;
            const outputDiv = document.getElementById('output');
            if (!query) return;
            outputDiv.innerHTML = "Searching reference...";
            try {
                const response = await yv.bible.getText({
                    version_id: versionId,
                    reference: query
                });
                outputDiv.innerHTML = response.data.content;
            } catch (error) {
                outputDiv.innerHTML = "Could not find that reference.";
            }
        }
        async function searchKeywords() {
            const versionId = 
                parseInt(document.getElementById('versionSelect').value);
            const term = document.getElementById('keywordInput').value;
            const resultsDiv = document.getElementById('searchResults');
            const resultsList = document.getElementById('resultsList');
            if (!term) return;
            resultsDiv.style.display = 'block';
            resultsList.innerHTML = "Searching for terms...";
            try {
                const response = await yv.bible.search({
                    version_id: versionId,
                    query: term
                });
                resultsList.innerHTML = "";
                const matches = response.data.results || [];
                if (matches.length === 0) {
                    resultsList.innerHTML = "No verses matched that term.";
                    return;
                }
                matches.slice(0, 10).forEach(match => {
                    const li = document.createElement('li');
                    li.innerHTML = 
                        <span class="result-ref">${match.reference}</span><span>${match.text}</span>;
                    li.onclick = () => {
                        document.getElementById('verseInput').value = match.reference;
                        lookupReference();
                    };
                    resultsList.appendChild(li);
                });
            } catch (error) {
                resultsList.innerHTML = "Keyword search failed.";
            }
        }
        // Run on startup
        renderBooks();
