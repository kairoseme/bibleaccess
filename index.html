<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multilingual Bible Portal</title>
    <style>
        :root {
            --bg-color: #2f2e2e;
            --text-color: #ffffff;
            --accent-color: #990000; /* Crimson Red */
            --input-bg: #403f3f;
            --border-color: #555555;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 15px;
            background-color: var(--bg-color); 
            color: var(--text-color); 
            -webkit-tap-highlight-color: transparent; /* Fixes mobile tap delay */
        }

        h3 { margin-top: 0; margin-bottom: 10px; color: var(--text-color); font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px;}
        .testament-title { font-size: 14px; font-weight: bold; color: #ccc; margin: 12px 0 6px 0; text-transform: uppercase; }

        .section {
            background-color: #383737;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 35px; /* Generous spacing for mobile */
            border: 1px solid var(--border-color);
        }

        .controls { display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; gap: 8px; }
        
        select, input { 
            padding: 14px; /* Slightly larger for easier mobile tap */
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            font-size: 16px; 
            width: 100%; 
            background-color: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }
        select:focus, input:focus { outline: 2px solid var(--accent-color); }

        button { 
            padding: 14px 20px; 
            background-color: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            white-space: nowrap;
        }
        button:active { background-color: #770000; } /* Mobile tap indicator */

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 5px;
        }
        .grid::-webkit-scrollbar { width: 6px; }
        .grid::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 4px; }

        .grid-item {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 8px; /* Touch-optimized */
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
        }
        .grid-item:active { background-color: var(--accent-color); }

        .bible-output { 
            line-height: 1.7; 
            font-size: 18px; 
            margin-top: 15px; 
            padding: 15px;
            background-color: #383737;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        .search-results-list { list-style: none; padding: 0; margin: 10px 0 0 0; }
        .search-results-list li { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .search-results-list li:active { background-color: var(--input-bg); }
        .result-ref { font-weight: bold; color: var(--accent-color); display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="section">
        <h3>1. Translation</h3>
        <select id="versionSelect" onchange="onVersionChange()">
            <option value="111">English (NIV)</option>
            <option value="12">English (KJV)</option>
            <option value="149">Spanish (RVR1960)</option>
            <option value="138">Polish (UBG)</option>
            <option value="122">Italian (NR2006)</option>
            <option value="63">French (LSG)</option>
            <option value="154">Portuguese (NVI)</option>
        </select>
    </div>

    <div class="section">
        <h3>2. Browse Books & Chapters</h3>
        <div id="browseContainer">
            <div class="testament-title">Old Testament</div>
            <div id="otGrid" class="grid"></div>
            <div class="testament-title">New Testament</div>
            <div id="ntGrid" class="grid"></div>
        </div>
        <div id="chapterGrid" class="grid" style="display:none;"></div>
        <button id="backToBooksBtn" onclick="renderBooks()" style="display:none; margin-top:10px; width:100%;">← Back to Books</button>
    </div>

    <div class="section">
        <h3>3. Search</h3>
        <div class="controls">
            <div class="row">
                <input type="text" id="keywordInput" placeholder="Enter keywords (e.g., 'faith')">
                <button id="searchTermsBtn">Search Terms</button>
            </div>
            <div class="row">
                <input type="text" id="verseInput" placeholder="Or exact reference (e.g., John 3:16)">
                <button id="goVerseBtn">Go to Verse</button>
            </div>
        </div>
        <div id="searchResults" style="display:none;">
            <ul id="resultsList" class="search-results-list"></ul>
        </div>
    </div>

    <h3>Scripture Reader</h3>
    <div id="output" class="bible-output">Select a translation and choose a book to begin reading.</div>

    <script>
        // CRITICAL CONFIGURATION
        const APP_KEY = "YOUR_YOUVERSION_APP_KEY"; // <-- Paste your exact App Key here
        const BASE_URL = "https://youversion.com";

        const bibleBooks = [
            { name: "Genesis", id: "GEN", chapters: 50, testament: "OT" },
            { name: "Exodus", id: "EXO", chapters: 40, testament: "OT" },
            { name: "Matthew", id: "MAT", chapters: 28, testament: "NT" },
            { name: "Mark", id: "MRK", chapters: 16, testament: "NT" },
            { name: "Luke", id: "LUK", chapters: 24, testament: "NT" },
            { name: "John", id: "JHN", chapters: 21, testament: "NT" },
            { name: "Romans", id: "ROM", chapters: 16, testament: "NT" },
            { name: "Revelation", id: "REV", chapters: 22, testament: "NT" }
        ];

        function renderBooks() {
            const otGrid = document.getElementById('otGrid');
            const ntGrid = document.getElementById('ntGrid');
            const browseContainer = document.getElementById('browseContainer');
            const chapterGrid = document.getElementById('chapterGrid');
            const backBtn = document.getElementById('backToBooksBtn');

            if(otGrid) otGrid.innerHTML = ""; 
            if(ntGrid) ntGrid.innerHTML = "";
            
            browseContainer.style.display = 'block';
            chapterGrid.style.display = 'none';
            backBtn.style.display = 'none';

            bibleBooks.forEach(book => {
                const item = document.createElement('div');
                item.className = 'grid-item';
                item.innerText = book.name;
                
                // FIXED: Using standard explicit touch listeners to guarantee mobile triggers
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    selectBook(book);
                });
                
                if (book.testament === "OT" && otGrid) otGrid.appendChild(item);
                else if (ntGrid) ntGrid.appendChild(item);
            });
        }

        function selectBook(book) {
            document.getElementById('browseContainer').style.display = 'none';
            const chapterGrid = document.getElementById('chapterGrid');
            const backBtn = document.getElementById('backToBooksBtn');
            chapterGrid.innerHTML = "";
            chapterGrid.style.display = 'grid';
            backBtn.style.display = 'block';

            for (let i = 1; i <= book.chapters; i++) {
                const item = document.createElement('div');
                item.className = 'grid-item';
                item.innerText = i;
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    loadChapter(book.id, i);
                });
                chapterGrid.appendChild(item);
            }
        }

        function onVersionChange() { renderBooks(); }

        // FIXED: Explicitly corrected headers format to meet YouVersion platform specifications
        async function fetchFromYouVersion(endpoint, params = {}) {
            const url = new URL(`${BASE_URL}/${endpoint}`);
            Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));

            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'accept': 'application/json',
                    'X-YVP-App-Key': APP_KEY // FIXED: Capitalization string fixed to map API gateway rules
                }
            });

            if (!response.ok) throw new Error(`API status: ${response.status}`);
            return await response.json();
        }

        async function loadChapter(bookId, chapterNum) {
            const versionId = document.getElementById('versionSelect').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Loading Chapter...";

            try {
                // FIXED: Endpoint mapping matching standard structural path
                const data = await fetchFromYouVersion(`bibles/${versionId}/books/${bookId}/chapters/${chapterNum}`);
                outputDiv.innerHTML = <h2>${bookId} ${chapterNum}</h2> + (data.content || data.html || 
                    "No text available.");
            } catch (error) {
                outputDiv.innerHTML = "Error loading chapter. Check your App Key or Bible licensing agreements.";
            }
        }
        async function lookupReference() {
            const versionId = document.getElementById('versionSelect').value;
            const query = document.getElementById('verseInput').value;
            const outputDiv = document.getElementById('output');
            if (!query) return;
            outputDiv.innerHTML = "Searching reference...";
            try {
                // Formatting assuming input query is parsed or matches explicit structureconst data = await fetchFromYouVersion(bibles/${versionId}/passages, { q: query });
                outputDiv.innerHTML = data.content || data.html || "No content found.";
            } catch (error) {
                outputDiv.innerHTML = "Could not find that reference.";
            }
        }
        async function searchKeywords() {
            const versionId = document.getElementById('versionSelect').value;
            const term = document.getElementById('keywordInput').value;
            const resultsDiv = document.getElementById('searchResults');
            const resultsList = document.getElementById('resultsList');
            if (!term) return;
            resultsDiv.style.display = 'block';
            resultsList.innerHTML = "Searching for terms...";
            try {
                const data = await fetchFromYouVersion(bibles/${versionId}/search, { q: term });
                    resultsList.innerHTML = "";
                const matches = data.results || [];
                if (matches.length === 0) {
                    resultsList.innerHTML = "No verses matched that term.";
                    return;
                }
                matches.slice(0, 10).forEach(match => {
                    const li = document.createElement('li');
                    li.innerHTML = <span class="result-ref">${match.reference}</span>
                        <span>${match.text}</span>;
                    li.addEventListener('click', () => {
                        document.getElementById('verseInput').value = match.reference;
                        lookupReference();
                    });
                resultsList.appendChild(li);
            });
        } catch (error) {
            resultsList.innerHTML = "Keyword search failed.";
        }
        }
        // FIXED: Binding event listeners explicitly to ensure execution inside mobile webviews
        document.getElementById('searchTermsBtn').addEventListener('click', searchKeywords);
        document.getElementById('goVerseBtn').addEventListener('click', lookupReference);
        // Run setup
        renderBooks();
