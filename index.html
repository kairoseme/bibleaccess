<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible App</title>
    <!-- Pull in the YouVersion Vanilla JS Web SDK Bundle -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 15px; background: #fff; color: #333; }
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 10px 15px; background: #941c1c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .bible-output { line-height: 1.6; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="verseInput" placeholder="e.g., John 3:16 or MAT.1">
        <button onclick="lookupScripture()">Search</button>
    </div>

    <div id="output" class="bible-output">Type a scripture reference above to begin reading.</div>

    <script>
        // Initialize YouVersion with your official App Key
        const yv = new YouVersionPlatform({
            appKey: "AlrazwADe3zjnfLx3t96EEDFiRSCxUtMk3lDoUQqwreUHAZw" // <-- Paste your App Key from platform.youversion.com
        });

        async function lookupScripture() {
            const query = document.getElementById('verseInput').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Loading Scripture...";

            try {
                // Call the YouVersion REST API via SDK to search/get text
                // Defaulting to NIV (Version ID 111) as an example
                const response = await yv.bible.getText({
                    version_id: 111, 
                    reference: query
                });
                
                outputDiv.innerHTML = response.data.content;
            } catch (error) {
                outputDiv.innerHTML = "Could not find that verse. Please try formatting like 'John 1' or 'GEN.1'.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
